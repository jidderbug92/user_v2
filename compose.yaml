services:
  user:
    build: .
    container_name: user
    command: python -m flask --app app.main:app run --host=0.0.0.0 --port=5000 --reload
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/code
    restart: unless-stopped
    networks:
      - shared
networks:
  shared:
    external: true
    name: inter-project
