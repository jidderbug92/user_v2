services:
  user:
    build: .
    container_name: user
    command: flask run --host=0.0.0.0 --port=5000 --reload
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - FLASK_APP=main.py
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/code
    restart: unless-stopped
